.primary{flex:1;background:var(--green);color:white}.ghost{background:var(--green2);color:var(--green)}.danger{background:var(--red2);color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}

#list{padding:0 10px}.stop{display:grid;grid-template-columns:27px 1fr;gap:7px;position:relative;margin-bottom:7px}.rail{display:flex;flex-direction:column;align-items:center}.seq{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:10px;font-weight:750;z-index:1}.seq.depot{background:var(--amber)}.seq.done{background:var(--ok)}.rail:after{content:"";width:1px;background:#d2d2d7;flex:1;margin-top:3px}.stop:last-child .rail:after{display:none}

const HISTORY=[
["19765","22751","25528","25536","25530","35115","25529","40755","40754","20579","25540","25548","19765"],
["19765","40747","25546","22743","35115","25529","20583","35120","19765"],
["19765","25553","25546","25536","35115","25529","20577","20583","20574","22747","40748","40755","40754","25540","25543","35116","20580","19765"],
["19765","22751","35125","25546","25530","22743","20577","20579","40754","20580","25532","19765"],
["19765","40747","22751","35116","25540","40748","20579","20574","20583","22743","25543","25546","35125","20584","25536","35115","19765"],
["19765","35116","20580","25534","40748","40754","35120","22747","20574","20577","35115","22743","25536","20582","25548","25553","19765"]
];
const ED={};HISTORY.forEach(r=>r.forEach((x,i)=>i<r.length-1&&(ED[x+">"+r[i+1]]=(ED[x+">"+r[i+1]]||0)+1)));

let route=[],map=null,markers=null,line=null,notes={};

const norm=s=>String(s??"").toLowerCase().replace(/[‘’´`]/g,"'").trim();
const find=s=>{s=String(s).trim();if(!s)return null;if(/^\d+$/.test(s))return DB.find(x=>x.oldId===s||x.newId===s)||null;let n=norm(s);return DB.find(x=>norm(x.name).includes(n))||null};
const dist=(a,b)=>{if(!a?.hasCoords||!b?.hasCoords)return 0;let R=6371,p=Math.PI/180,dlat=(b.lat-a.lat)*p,dlon=(b.lng-a.lng)*p,A=Math.sin(dlat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dlon/2)**2;return R*2*Math.atan2(Math.sqrt(A),Math.sqrt(1-A))};
const bonus=(a,b)=>Math.min(20,((ED[a+">"+b]||0)+(ED[b+">"+a]||0)*.35)*6);
const cost=(a,b)=>Math.max(.05,dist(a,b)-bonus(a.oldId,b.oldId));

function classify(a){
 const g={west:[],furqat:[],end:[],normal:[],nay:null};
 a.forEach(x=>{
  if(["35116","25543","25540","20581"].includes(x.oldId))return g.end.push(x);
  if(x.oldId==="31212")return g.nay=x;
  if(/O‘zbekiston|Beshariq/.test(x.region))return g.west.push(x);
  if(/Furqat/.test(x.region))return g.furqat.push(x);
  g.normal.push(x);
 });return g;
}
function nearest(a,start){
 a=[...a];let out=[],cur=start;
 while(a.length){let k=0,b=Infinity;a.forEach((x,i)=>{let c=cost(cur,x);if(c<b)b=c,k=i});cur=a.splice(k,1)[0];out.push(cur)}
 return out;
}
function optimize(nodes){
 if(nodes.length<=1)return nodes;
 let [depot,...targets]=nodes,g=classify(targets);
 let west=nearest(g.west,depot),fur=nearest(g.furqat,west.at(-1)||depot),loop=[...west,...fur];
 if(g.nay)loop.push(g.nay);
 let normal=nearest(g.normal,loop.at(-1)||depot),end=nearest(g.end,normal.at(-1)||loop.at(-1)||depot);
 return [depot,...loop,...normal,...end];
}
function make(x,extra={}){return {...x,done:false,note:notes[x.oldId]||"",...extra}}

function parse(text){
 notes={};let ids=[];
 text.split(/\n/).forEach(line=>{
  line=line.trim();if(!line)return;
  let m=line.match(/\b\d{5}\b/);
  if(m){
   let item=find(m[0]);if(item){
    let note=line.replace(m[0],"").trim();
    if(note)notes[item.oldId]=[...(notes[item.oldId]||[]),note];
    if(!ids.some(x=>x.oldId===item.oldId))ids.push(item);
   }
  }
 });
 Object.keys(notes).forEach(k=>notes[k]=notes[k].join(" • "));
 return ids;
}

function rebuild(items){
 const depot=DB.find(x=>x.oldId===START),unique=[];
 items.forEach(x=>{if(x.oldId!==START&&!unique.some(y=>y.oldId===x.oldId))unique.push(x)});
 const old={};route.forEach(x=>x.note&&(old[x.oldId]=x.note));
 const ordered=optimize([depot,...unique]).slice(1);
 route=[make(depot,{isDepot:true,isStartDepot:true}),...ordered.map(x=>make(x,{note:old[x.oldId]||notes[x.oldId]||"",justAdded:!!x.justAdded})),make(depot,{oldId:START+"_END",isDepot:true,isReturnDepot:true,name:depot.name+" (Qaytish)"})];
 saveState();render();
}

function build(){
 setBusy(true);
 try{let items=parse($("input").value);if(!items.length){route=[];render();return}rebuild(items)}
 finally{setBusy(false)}
}

function quickAdd(){
 let val=$("quickInput").value.trim();if(!val)return;
 let x=find(val);if(!x)return toast("ID topilmadi");

 let items=route.filter(x=>!x.isDepot).map(x=>DB.find(d=>d.oldId===x.oldId)).filter(Boolean);
 if(items.some(y=>y.oldId===x.oldId))return toast("Bu ID allaqachon bor");
 x={...x,justAdded:true};items.push(x);rebuild(items);$("quickInput").value="";toast("Yangi ID qo‘shildi");
}

function move(i,d){let j=i+d;if(j<1||j>=route.length-1)return;[route[i],route[j]]=[route[j],route[i]];saveState();render()}
function toggleDone(i){route[i].done=!route[i].done;saveState();render()}
function remove(i){route.splice(i,1);saveState();render()}
function note(i,v){if(route[i]){route[i].note=v;saveState()}}

function setBusy(b){

}
function file64(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file)})}

async function scan(file){
 if(!file)return;
 setBusy(true);
 try{
  const data=await file64(file);
  const prompt=`Siz bankomatlar jadvalidan vazifalarni aniq o‘qiydigan OCR yordamchisiz.
Rasmdagi barcha haqiqiy 5 xonali bankomat IDlarini toping.
Har bir IDning yonidagi barcha vazifalarni yozing: 410, 710, smart, dispenser, rider va boshqalar.
Faqat shu formatda qaytaring:
62641 710 4-200
62614 дисп
Hech qanday izoh bermang.`;
  const res=await fetch(GEMINI_PROXY_URL,{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({model:"gemini-3.6-flash",input:[
    {type:"text",text:prompt},
    {type:"image",mime_type:file.type||"image/jpeg",data}
   ],store:false})
  });
  const d=await res.json();
  if(!res.ok||d.error)throw Error(d.error?.message||`API xatosi: ${res.status}`);
  const text=d.output_text?.trim()||d.steps?.flatMap(s=>s.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n").trim()||"";
  if(!text)throw Error("Rasmdan ma’lumot olinmadi");
  $("input").value=text;build();toast("Rasm o‘qildi");
 }catch(e){console.error(e);$("error").innerHTML=`<div style="color:var(--red);font-size:11px;margin-top:6px">${esc(e.message)}</div>`}
 finally{$("file").value="";setBusy(false)}
}

const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const km=x=>x<1?Math.round(x*1000)+" m":x.toFixed(1)+" km";

function render(){
 const has=route.length>0;
 $("tabs").style.display=has?"flex":"none";$("summary").style.display=has?"flex":"none";$("quick").style.display=has?"flex":"none";
 renderList();renderSummary();renderHistory();nav();
 if(map&&$("mapView").style.display!=="none")renderMap();
}

function renderList(){
 if(!route.length){$("list").innerHTML='<div style="text-align:center;color:var(--muted);padding:35px 10px;font-size:12px">Marshrut tuzilmagan</div>';return}
 $("list").innerHTML=route.map((s,i)=>{
  let seq=s.isStartDepot?"B":s.isReturnDepot?"Q":i,cl=s.isDepot?"depot":s.done?"done":"";
  return `<div class="stop"><div class="rail"><div class="seq ${cl}">${seq}</div></div><div class="stopcard ${s.done?"done":""}">
  ${!s.isDepot?`<button class="remove" onclick="remove(${i})">×</button>`:""}
  <div class="name">${esc(s.name)}${s.justAdded?'<span class="badge new">YANGI</span>':""}</div>
  ${!s.isDepot?`<div class="ids">eski ${esc(s.oldId)} · yangi ${esc(s.newId)}</div>`:""}
  ${!s.isDepot?`<input class="note" value="${esc(s.note||"")}" placeholder="Vazifa / izoh..." oninput="note(${i},this.value)">`:""}
  ${!s.isDepot?`<div class="actions">
    ${s.hasCoords?`<a class="mini" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">Google</a><a class="mini y" target="_blank" href="yandexnavi://build_route_on_map?lat_to=${s.lat}&lon_to=${s.lng}">Yandex</a>`:""}
    <div class="moves">
      <button class="move" onclick="move(${i},-1)" ${i===1?"disabled":""}>▲</button>
      <button class="move" onclick="move(${i},1)" ${i===route.length-2?"disabled":""}>▼</button>
    </div>
    <button class="done ${s.done?"on":""}" onclick="toggleDone(${i})">${s.done?"✓ Bajarildi":"Bajarildi"}</button>
  </div>`:""}
  </div></div>`
 }).join("");
}

function renderSummary(){
 let pts=route.filter(x=>x.hasCoords),d=0;for(let i=0;i<pts.length-1;i++)d+=dist(pts[i],pts[i+1]);
 let done=route.filter(x=>x.done&&!x.isDepot).length,total=route.filter(x=>!x.isDepot).length;
 $("doneStat").textContent=`${done}/${total}`;$("distStat").textContent=km(d);$("timeStat").textContent=Math.round(d/SPEED*60)+" d";
}

function nav(){
 let p=route.filter(x=>x.hasCoords);if(p.length<2)return;
 let o=p[0],z=p.at(-1),wp=p.slice(1,-1).map(x=>`${x.lat},${x.lng}`).join("|");
 $("googleAll").href=`https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${z.lat},${z.lng}&waypoints=${wp}&travelmode=driving`;
 $("yandexAll").href=`yandexnavi://build_route_on_map?lat_from=${o.lat}&lon_from=${o.lng}&lat_to=${z.lat}&lon_to=${z.lng}`;
}

function ensureMap(){if(map)return;map=L.map("map");L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);markers=L.layerGroup().addTo(map)}

function renderMap(){
 ensureMap();
 markers.clearLayers();
 
 route.forEach((s, i)=>{
  if(!s.hasCoords) return;
  let label = s.isStartDepot ? "B" : s.isReturnDepot ? "Q" : String(i);
  
  // Custom raqamlangan marker ikonka
  let icon = L.divIcon({
   className: 'custom-map-marker',
   html: `<div style="background:${s.isDepot?'#c97a22':'#16543f'};color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:bold;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)">${label}</div>`,
   iconSize: [26, 26],
   iconAnchor: [13, 13]
  });

  L.marker([s.lat, s.lng], {icon}).addTo(markers).bindPopup(`<b>${label}. ${esc(s.name)}</b>${s.note?`<br>${esc(s.note)}`:""}`);
 });

 let p=route.filter(x=>x.hasCoords),ll=p.map(x=>[x.lat,x.lng]);
 if(line)line.remove();
 line=L.polyline(ll,{color:"#16543f",weight:4,opacity:0.8}).addTo(map);
 if(ll.length)map.fitBounds(line.getBounds(),{padding:[20,20]});
}

function tab(name){
 let list=name==="list";$("listTab").classList.toggle("active",list);$("mapTab").classList.toggle("active",!list);$("list").style.display=list?"block":"none";$("mapView").style.display=list?"none":"block";
 if(!list)setTimeout(()=>{ensureMap();map.invalidateSize();renderMap()},50);
}

function saveState(){localStorage.setItem(STORE.route,JSON.stringify(route))}
function loadState(){try{let x=JSON.parse(localStorage.getItem(STORE.route));if(Array.isArray(x)&&x.length)route=x}catch{}}
function history(){try{return JSON.parse(localStorage.getItem(STORE.history))||[]}catch{return[]}}
function renderHistory(){
 let h=history();$("historyBox").style.display=h.length?"block":"none";$("historyList").innerHTML=h.map(x=>`<div class="hist"><div><b>${esc(x.name)}</b><br><small>${esc(x.date)} · ${x.count} ta</small></div><div><button class="btn ghost" onclick="loadHist('${x.id}')">Yuklash</button><button class="btn danger" onclick="delHist('${x.id}')">×</button></div></div>`).join("");
}
window.loadHist=id=>{let x=history().find(y=>y.id===id);if(x&&confirm("Marshrut almashtirilsinmi?")){route=x.data;saveState();render()}};
window.delHist=id=>{localStorage.setItem(STORE.history,JSON.stringify(history().filter(x=>x.id!==id)));renderHistory()};
function toast(s){let t=$("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
function copyRoute(){let s="Qo‘qon marshruti\n"+route.map((x,i)=>`${x.isStartDepot?"B":x.isReturnDepot?"Q":i}. ${x.name}${x.note?" ["+x.note+"]":""}`).join("\n");navigator.clipboard?.writeText(s).then(()=>toast("Nusxalandi"))}
function clear(){if(confirm("Marshrut tozalansinmi?")){route=[];localStorage.removeItem(STORE.route);render()}}
function reset(){if(confirm("Yangi kun boshlansinmi?")){route=[];$("input").value="";localStorage.removeItem(STORE.route);render()}}

$("date").textContent=new Date().toLocaleDateString("uz-UZ",{weekday:"long",day:"numeric",month:"long"});
$("upload").onclick=()=>$("file").click();$("file").onchange=e=>scan(e.target.files[0]);
$("build").onclick=build;
$("quickBtn").onclick=quickAdd;
$("quickInput").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();quickAdd();}};
$("listTab").onclick=()=>tab("list");$("mapTab").onclick=()=>tab("map");$("clear").onclick=clear;$("reset").onclick=reset;$("copy").onclick=copyRoute;
$("historyToggle").onclick=()=>{$("historyBody").classList.toggle("open");$("arrow").textContent=$("historyBody").classList.contains("open")?"▲":"▼"};
$("save").onclick=()=>{$("routeName").value="Marshrut "+new Date().toLocaleDateString("uz-UZ");$("modal").classList.add("open")};
$("modalClose").onclick=()=>$("modal").classList.remove("open");
$("modalSave").onclick=()=>{let n=$("routeName").value.trim();if(!n)return;let h=history();h.unshift({id:Date.now()+"",name:n,date:new Date().toLocaleDateString("uz-UZ"),count:route.filter(x=>!x.isDepot).length,data:route});localStorage.setItem(STORE.history,JSON.stringify(h));$("modal").classList.remove("open");renderHistory();toast("Saqlandi")};
loadState();render();
</script>
</body>
</html>
